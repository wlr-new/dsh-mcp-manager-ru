# dsh-mcp-manager bundle patch: inserts the plugin row into the profile roster.
# Applied as a profile bundle layer (declared by the `dsh.bundle.patch`
# manifest field in package.json). Activate with:
#
#   # local development (link)
#   dsh plugin --profile web add link:/path/to/dsh-mcp-manager
#   # after publishing to GitHub (repo tagged with the `dsh-plugin` topic)
#   dsh plugin --profile web add github:zhengjy01/dsh-mcp-manager
- insert:
    - id: mcp-manager
      name: '@zhengjunyao/dsh-mcp-manager'
      config:
        announceToAgent: true   # объявить плагин в системном промпте (инструменты + описание возможностей)
        enabled: true           # главный переключатель плагина
